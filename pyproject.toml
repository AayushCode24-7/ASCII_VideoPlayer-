[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-video"
version = "0.1.0"
description = "Play any video URL as live ASCII art in your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aayush Jindal" }]
dependencies = [
    "opencv-python",
    "numpy",
    "yt-dlp",
    "certifi",
]

[project.scripts]
ascii-video = "ascii_video:main"

[tool.setuptools]
py-modules = ["ascii_video"]